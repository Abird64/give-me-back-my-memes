<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  body { margin: 0; background: #E9E4D8; display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="v1" width="1024" height="1024"></canvas>
<canvas id="v2" width="1024" height="1024"></canvas>
<canvas id="v3" width="1024" height="1024"></canvas>
<canvas id="v4" width="1024" height="1024"></canvas>
<script>
const INK = '#1B1B1F', YEL = '#FFD23F', PAPER = '#FFFCF5', MAG = '#FF3D8F', VIO = '#7C4DFF',
      WX = '#2FBF71', QQ = '#1DA1F2', DY = '#FF2E4D', TEAL = '#15C4C4', TONGUE = '#FF6B7E';

function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function plate(c, x, y, w, h, r, fill, { lw = 26, sh = 34, rot = 0 } = {}) {
  c.save(); c.translate(x + w / 2, y + h / 2); c.rotate(rot); c.translate(-w / 2, -h / 2);
  c.fillStyle = INK; rr(c, sh, sh, w, h, r); c.fill();
  c.fillStyle = fill; rr(c, 0, 0, w, h, r); c.fill();
  c.strokeStyle = INK; c.lineWidth = lw; c.lineJoin = 'round'; rr(c, 0, 0, w, h, r); c.stroke();
  c.restore();
}
function spark(c, x, y, R, col) {
  const r = R * 0.25, pts = [];
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    pts.push([x + Math.cos(a) * R, y + Math.sin(a) * R]);
    const a2 = a + Math.PI / 4;
    pts.push([x + Math.cos(a2) * r, y + Math.sin(a2) * r]);
  }
  c.save(); c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath();
  c.fillStyle = col; c.fill(); c.strokeStyle = INK; c.lineWidth = 12; c.stroke(); c.restore();
}
// 表情包脸：^^ 眼 + 大张嘴笑 + 舌头 + 泪
function emoFace(c, cx, cy, s, { lw = 24, tear = TEAL, tongue = true } = {}) {
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = INK; c.lineWidth = lw;
  for (const sg of [-1, 1]) {
    c.beginPath(); c.arc(cx + sg * s * 0.36, cy - s * 0.10, s * 0.20, Math.PI * 1.18, Math.PI * 1.82); c.stroke();
  }
  // 大张嘴：黑色填充，下凸半圆
  const mw = s * 0.50, mh = s * 0.40, my = cy + s * 0.08;
  c.beginPath(); c.moveTo(cx - mw, my); c.quadraticCurveTo(cx, my + mh * 1.9, cx + mw, my); c.closePath();
  c.fillStyle = INK; c.fill();
  // 舌头（可选）
  if (tongue) {
    c.save(); c.beginPath(); c.moveTo(cx - mw, my); c.quadraticCurveTo(cx, my + mh * 1.9, cx + mw, my); c.closePath(); c.clip();
    c.fillStyle = TONGUE; c.beginPath(); c.ellipse(cx, my + mh * 1.18, mw * 0.55, mh * 0.52, 0, 0, 7); c.fill(); c.restore();
  }
  // 泪（可选）
  if (tear) {
    c.fillStyle = tear;
    c.beginPath(); c.moveTo(cx - s * 0.56, cy + s * 0.06);
    c.quadraticCurveTo(cx - s * 0.70, cy + s * 0.30, cx - s * 0.52, cy + s * 0.30);
    c.quadraticCurveTo(cx - s * 0.40, cy + s * 0.26, cx - s * 0.56, cy + s * 0.06); c.fill();
  }
  c.restore();
}

/* V1 回旋：紫底 + 黄脸 + 白色回旋箭头（表情回来了） */
(() => {
  const c = document.getElementById('v1').getContext('2d');
  plate(c, 96, 96, 832, 832, 190, VIO);
  plate(c, 246, 178, 532, 532, 64, YEL, { lw: 24, sh: 26 });
  emoFace(c, 512, 454, 240, { lw: 24 });
  // 回旋箭头：贴纸右下角外侧绕一圈
  const cx0 = 736, cy0 = 742, R0 = 118;
  const arcPath = (g) => { g.beginPath(); g.arc(cx0, cy0, R0, -0.42 * Math.PI, 0.96 * Math.PI); };
  c.save(); c.lineCap = 'round';
  c.strokeStyle = INK; c.lineWidth = 62; arcPath(c); c.stroke();
  c.strokeStyle = PAPER; c.lineWidth = 32; arcPath(c); c.stroke();
  // 箭尖（在弧起点，沿切线方向）
  const a0 = -0.42 * Math.PI, px = cx0 + Math.cos(a0) * R0, py = cy0 + Math.sin(a0) * R0;
  c.save(); c.translate(px, py); c.rotate(a0 - Math.PI / 2);
  c.fillStyle = PAPER; c.strokeStyle = INK; c.lineWidth = 16;
  c.beginPath(); c.moveTo(0, -8); c.lineTo(62, 44); c.lineTo(-16, 52); c.closePath(); c.fill(); c.stroke();
  c.restore(); c.restore();
  spark(c, 800, 196, 48, PAPER);
})();

/* V2 三平台：品红底 + 黄脸 + 下方三个平台圆点 */
(() => {
  const c = document.getElementById('v2').getContext('2d');
  plate(c, 96, 96, 832, 832, 190, MAG);
  plate(c, 208, 138, 608, 552, 64, YEL, { lw: 24, sh: 24 });
  emoFace(c, 512, 414, 262, { lw: 24 });
  const dot = (x, col) => {
    c.save();
    c.strokeStyle = INK; c.lineWidth = 20;
    c.fillStyle = col; c.beginPath(); c.arc(x, 826, 72, 0, 7); c.fill(); c.stroke();
    c.restore();
  };
  dot(360, WX); dot(512, QQ); dot(664, DY);
})();

/* V3 箱子：黄底 + 品红箱 + 表情从箱口探出 */
(() => {
  const c = document.getElementById('v3').getContext('2d');
  plate(c, 96, 96, 832, 832, 190, YEL);
  // 表情（在箱子后面）
  plate(c, 300, 210, 424, 424, 56, PAPER, { lw: 22, sh: 18 });
  emoFace(c, 512, 412, 206, { lw: 22 });
  // 箱体
  plate(c, 214, 540, 596, 300, 44, MAG, { lw: 26, sh: 24 });
  // 箱口内衬
  c.save();
  c.fillStyle = INK; rr(c, 262, 526, 500, 66, 22); c.fill();
  c.fillStyle = '#F0DDB6'; rr(c, 274, 534, 476, 34, 14); c.fill();
  c.restore();
  // 两条胶带（斜拉，不是竖柱）
  c.save(); c.fillStyle = 'rgba(255,252,245,.85)'; c.strokeStyle = INK; c.lineWidth = 10;
  for (const sx of [330, 694]) {
    c.beginPath(); c.moveTo(sx, 596); c.lineTo(sx + 46, 596); c.lineTo(sx + 46, 812); c.lineTo(sx, 812); c.closePath(); c.fill(); c.stroke();
  }
  c.restore();
})();

/* V4 最终版：黄方贴纸 + 黑边 + 硬阴影 + 笑脸（无泪、无星芒） */
(() => {
  const c = document.getElementById('v4').getContext('2d');
  plate(c, 150, 130, 700, 700, 100, YEL, { lw: 26, sh: 34 });
  emoFace(c, 500, 470, 300, { lw: 28, tear: null, tongue: false });
})();
</script>
</body>
</html>
