<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>应用图标 · 仓鼠正面（举镐）</title>
<style>
  body { margin: 0; background: #E9E4D8; display: flex; gap: 28px; padding: 28px;
         font: 13px/1.5 ui-monospace, Consolas, monospace; color: #3a3530; }
  figure { margin: 0; }
  canvas { display: block; border-radius: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  figcaption { padding-top: 8px; }
</style>
</head>
<body>
<!--
  应用图标现行稿：仓鼠正面（安全帽 + 镐），扁平贴纸风，黄底黑描边。

  这个文件是「图标母版」的唯一生成源，旁边 hamster-front.svg 是角色素材。
  派生文件（同目录）：
    app-icon-transparent.png  1024  全出血、透明背景   ← 本页左图另存
    icon-1024.png             1024  白底 logo 版（作品缩到 ink 宽 ~760 居中）
    icon-512.png / icon-256.png    icon-1024 的等比缩小
    app-icon.ico              16/24/32/48/64/128/256 多尺寸（由全出血母版降采样）
  README 里引的是 icon-256.png；PyInstaller 用 app-icon.ico（见 build/emoji-migrator.spec）。
  改图标 = 改这里 → 重新导出上面那几个文件，别直接改 PNG。
-->
<figure>
  <canvas id="master" width="1024" height="1024"></canvas>
  <figcaption>① app-icon-transparent.png（1024，全出血）</figcaption>
</figure>
<figure>
  <canvas id="logo" width="1024" height="1024"></canvas>
  <figcaption>② icon-1024.png（白底 logo 版）</figcaption>
</figure>
<script>
const INK = '#282320', YEL = '#FFD23F';
const SRC = 'hamster-front.svg';

/* 圆角方贴纸：932 见方、46 内缩、196 圆角、38 描边 */
function plate(c) {
  c.beginPath();
  c.roundRect(46, 46, 932, 932, 196);
  c.fillStyle = YEL; c.fill();
  c.lineWidth = 38; c.strokeStyle = INK; c.stroke();
}

/* 角色：和分镜里用的是同一张，1024 画布缩放到 (120,96,784) 摆位 */
function drawMaster(c, img, scale = 1, clear = true) {
  if (clear) c.clearRect(0, 0, 1024, 1024);
  c.save();
  if (scale !== 1) {                     // logo 版整体缩到中心
    c.translate(512, 512); c.scale(scale, scale); c.translate(-512, -512);
  }
  plate(c);
  c.save();
  c.beginPath(); c.roundRect(46, 46, 932, 932, 196); c.clip();
  c.drawImage(img, 0, 0, 1024, 1024, 120, 96, 784, 784);
  c.restore();
  c.restore();
}

const img = new Image();
img.onload = () => {
  drawMaster(document.getElementById('master').getContext('2d'), img, 1);
  const lg = document.getElementById('logo');
  const lc = lg.getContext('2d');
  lc.fillStyle = '#FFFFFF'; lc.fillRect(10, 10, 1004, 1004);   // 白底 10px 透明边
  drawMaster(lc, img, 760 / 970, false);                       // ink 宽 970 → 760
};
img.onerror = () => { document.body.insertAdjacentHTML('beforeend',
  '<p style="color:#b00">hamster-front.svg 没加载到——本页需要和它放在同一目录。</p>'); };
img.src = SRC;
</script>
</body>
</html>
